<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="360" fill="#ffffff"/>

  <!-- Brief: three signals converge into one contract -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 118 104 C 190 130 210 158 244 172"/>
    <path d="M 106 182 L 244 182"/>
    <path d="M 118 260 C 190 234 210 206 244 192"/>
  </g>
  <circle cx="96" cy="96" r="20" fill="#7dd3fc"/>
  <circle cx="84" cy="182" r="20" fill="#38bdf8"/>
  <circle cx="96" cy="268" r="20" fill="#0ea5e9"/>

  <!-- TASK.md: one executable contract -->
  <text x="380" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">TASK.md</text>
  <rect x="252" y="76" width="256" height="212" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <rect x="288" y="116" width="184" height="16" rx="8" fill="#0f172a"/>
  <rect x="288" y="156" width="150" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="288" y="196" width="168" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="288" y="234" width="104" height="32" rx="16" fill="#d1fae5"/>
  <text x="340" y="256" text-anchor="middle" font-size="17" font-weight="600" fill="#059669">ready</text>

  <!-- Execute: the contract fans out into parallel waves -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 508 150 C 570 140 590 122 636 112"/>
    <path d="M 508 182 L 636 182"/>
    <path d="M 508 214 C 570 224 590 242 636 252"/>
  </g>
  <rect x="644" y="96" width="176" height="32" rx="16" fill="#34d399" opacity="0.8"/>
  <rect x="644" y="166" width="220" height="32" rx="16" fill="#34d399"/>
  <rect x="644" y="236" width="140" height="32" rx="16" fill="#34d399" opacity="0.8"/>

  <!-- Verified done -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 820 112 C 856 126 862 150 872 164"/>
    <path d="M 864 182 L 872 182"/>
    <path d="M 784 252 C 830 238 856 214 872 200"/>
  </g>
  <circle cx="906" cy="182" r="34" fill="#059669"/>
  <path d="M 890 183 l 11 12 l 21 -25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="176" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">/microspec.brief</text>
  <text x="760" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">/microspec.execute</text>
</svg>
